<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="version" content="1.1">
<meta name="description" content="교실 자리 옮기기·캠핑장 걷기로 시차를 몸으로 느끼고, 시차 측정 판으로 거리와 시차의 관계를 재고, 지구 공전 모형과 6개월 간격 별 사진으로 연주 시차를 구해 별까지의 거리를 비교하는 중학교 과학 가상실험실">
<meta property="og:title" content="송쌤과학 가상실험실 | 연주 시차와 별까지의 거리">
<meta property="og:description" content="관측 위치가 바뀌면 가까운 물체만 먼 배경 위에서 옮겨 보여요. 시차를 재고, 연주 시차로 별까지의 거리를 비교해요">
<meta name="theme-color" id="metaTheme" content="#0e1524">
<title>송쌤과학 가상실험실 | 연주 시차와 별까지의 거리</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>(function(){try{var t=localStorage.getItem('ssv-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})();</script>
<style>
/* ① 테마와 무관한 토큰 */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-1:6px;--r-2:10px;--r-3:14px;--r-full:999px;
  --control-h:34px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:52px;--rail-w:80px;--panel-w:clamp(330px,29vw,410px);
  --light-angle:315deg;
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
/* 실물·장면 색 — 테마와 무관(종이 판·밤하늘·낮 풍경은 실제 색 그대로) */
:root{
  /* 우주·밤하늘 장면 위 */
  --space-0:#03060e;--space-1:#0a1326;--space-2:#13203a;--space-grid:#2a3a58;
  --on-stage-1:#eef2f8;--on-stage-2:#aab7ca;--stage-chip-bg:#0a1326;
  --a-glow:#62bdf0;--b-glow:#f2ac48;--px-glow:#ef93d3;
  --star-1:#fff6d8;--star-2:#ffe29a;--star-hot:#cfe2ff;--star-red:#ffb08a;--bgstar:#c9d3e6;
  --sun-1:#fff3c0;--sun-2:#ffb547;--sun-3:#f07a1e;--earth-1:#7fd0ff;--earth-2:#2f7fc6;--earth-land:#6fbf73;--orbit:#8fa3c0;
  /* 시차 측정 판(종이) */
  --paper:#eef1f4;--paper-lo:#d8dee6;--paper-edge:#aeb9c6;--paper-ink:#1f2c3b;--paper-ink-2:#51606f;
  --a-ink:#0f6db3;--b-ink:#bf5f00;--px-ink:#a82f7c;--star-sticker:#f5b700;--star-sticker-lo:#c98a00;--stand:#8a96a3;
  --plastic:#cfe8f2;--plastic-line:#4d7488;
  /* 교실 */
  --wall:#ece6d8;--wall-2:#e2dac8;--wall-lo:#cfc5b0;--ceil:#f5f3ee;--lamp:#fffdf2;
  --board:#2e5a48;--board-2:#27503f;--board-frame:#8a6a45;--chalk:#f4f1e4;--floor:#c99b66;--floor-2:#b98a55;--floor-line:#a97a47;
  --window:#cfe6f5;--window-2:#a9d0ea;--frame:#f6f4ee;--cork:#c9a071;--poster:#fbfaf6;
  --skin:#f2c5a0;--skin-lo:#d9a37e;--hair:#3a2a22;--top:#2f5f8a;--top-lo:#244b6e;--shirt:#f4f4f2;--pants:#3c4250;--pants-lo:#2d323d;--shoe:#26221f;
  --desk:#d8b88a;--desk-lo:#b8966a;--chair:#5b6f86;
  /* 캠핑장 */
  --sky-top:#7fbde8;--sky-low:#d7ecf7;--cloud:#ffffff;--mtn-far:#9db8c9;--mtn-near:#7fa393;
  --grass-far:#a9d27f;--grass-near:#78b152;--grass-tuft:#5e9b40;--path:#d9c49a;--path-lo:#c7ae80;
  --tree-1:#3f7d4e;--tree-2:#2f6640;--trunk:#6b4a32;
  --tent:#e2583e;--tent-lo:#b8412c;--tent-door:#f1c46a;--van:#f4f4ef;--van-lo:#cfd3d6;--van-stripe:#3a8fc8;--glass:#2c3e50;--tire:#26282b;--hub:#b9c0c7;
  --post:#8f6238;--post-lo:#6e4a28;--signboard:#d7a766;--signboard-lo:#b98a4d;--sign-ink:#3a2715;
  --shadow-ink:#000000;
}
/* ② 테마 토큰 — 두 블록은 같은 목록을 갖는다 */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#090e1a;--surface-1:#0e1524;--surface-2:#172134;
  --stage:#0c1322;--stage-2:#121b2d;
  --text-1:#e9eef6;--text-2:#b3bfd0;--text-3:#8d9bb0;
  --line-1:#1f2a3d;--line-2:#34435b;
  --accent:#e9eef6;--accent-strong:#ffffff;--accent-soft:#1f2a3d;--on-accent:#090e1a;
  --focus:#e9eef6;--scrim:#02060dcc;
  --ok:#6fdcae;--ok-soft:#1b3a33;--warn:#ffcf5c;--warn-soft:#3d3622;--danger:#ff9d8a;--danger-soft:#3d2320;--rev-soft:#18304c;
  --a:#62bdf0;--b:#f2ac48;--px:#ec8fd0;--a-soft:#62bdf026;--b-soft:#f2ac4826;--px-soft:#ec8fd022;
  --map-bg:#0c1322;--map-floor:#141d30;--map-wall:#3a4a63;--map-thing:#24324a;--map-thing-2:#30405b;--map-ink:#c6d1e0;--map-green:#18302a;--map-green-2:#1f3b31;
  --track:#1c2638;
  --shadow-color:222 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#eef1f6;--surface-1:#fbfcfe;--surface-2:#e3e8f0;
  --stage:#f6f8fb;--stage-2:#e9eef5;
  --text-1:#14223a;--text-2:#46566e;--text-3:#5a6a82;
  --line-1:#d5dce7;--line-2:#b4c0d0;
  --accent:#17243a;--accent-strong:#0b1526;--accent-soft:#e3e8f0;--on-accent:#ffffff;
  --focus:#17243a;--scrim:#0b1a2680;
  --ok:#11775a;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;--danger:#b3261e;--danger-soft:#fde4e1;--rev-soft:#dcebf8;
  --a:#0b6fb0;--b:#b35f00;--px:#a3337a;--a-soft:#0b6fb01f;--b-soft:#b35f001f;--px-soft:#a3337a1a;
  --map-bg:#f6f8fb;--map-floor:#eef1f5;--map-wall:#8d9bb0;--map-thing:#dfe5ee;--map-thing-2:#c9d2df;--map-ink:#2b3a52;--map-green:#e2efdc;--map-green-2:#cfe5c6;
  --track:#e3e8f0;
  --shadow-color:215 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .3);
  --edge-hi:0 0 #0000;
}
/* 인쇄용 상황 그림: 밤하늘 장면도 흰 바탕으로 */
:root[data-print]{--space-0:#ffffff;--space-1:#ffffff;--space-2:#eef1f5;--space-grid:#c8d0dc;--on-stage-1:#14223a;--on-stage-2:#46566e;--stage-chip-bg:#eef1f6;--star-1:#1c2a40;--star-2:#c98a00;--star-hot:#3b6fd0;--star-red:#c0503a;--bgstar:#7d8aa0;--a-glow:#0b6fb0;--b-glow:#b35f00;--px-glow:#a3337a;--orbit:#7d8aa0;--stage-2:#eef1f5;--stage:#ffffff}
/* ③ 마감 기본층 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--a) 30%,transparent)}
input,textarea{caret-color:var(--text-1)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:800}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic .fill{fill:currentColor;stroke:none}

/* 상단 바 */
.topbar{position:relative;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:center;gap:8px;min-width:0;font:600 15px/1.2 var(--font-ui);color:var(--text-1)}
.top-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver{font:600 12px/1 var(--font-ui);color:var(--text-2);border:1px solid var(--line-2);border-radius:var(--r-1);padding:3px 6px;font-variant-numeric:tabular-nums}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}

/* 앱 골격 */
.appbody{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:calc(100dvh - var(--top-h))}
.rail{display:flex;flex-direction:column;gap:4px;padding:12px 8px;background:var(--surface-1);border-right:1px solid var(--line-1);overflow-y:auto}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:70px;padding:8px 2px;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);font:600 12px/1.25 var(--font-ui);text-align:center;cursor:pointer}
.rail button svg.ic{width:24px;height:24px;stroke-width:1.7}
.rail button .s{display:none}
.rail button[aria-current="page"]{background:var(--surface-2);color:var(--text-1);font-weight:800}
.rail button[aria-current="page"]::after{content:'';position:absolute;left:-8px;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--text-1)}
.rail .rn{position:absolute;top:6px;left:8px;font:700 12px/1 var(--font-ui);color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.rail button:hover{color:var(--text-1)}}
main{position:relative;overflow:auto;padding:10px 16px 14px;min-width:0;outline:none}
.lab{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;height:100%;min-height:0}
.lab-head{display:flex;align-items:center;gap:6px 14px;min-height:36px;flex-wrap:wrap}
.lab-head h1{font:800 18px/1.3 var(--font-title);letter-spacing:-.02em}
.goal{margin:0;font-size:13px;line-height:1.45;color:var(--text-2);font-weight:500}
.goal b{color:var(--text-1);font-weight:700}
.head-seg{margin-left:auto}
.work{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:14px;min-height:0}
.work.solo{grid-template-columns:minmax(0,1fr)}
.bench{display:flex;flex-direction:column;min-height:0;min-width:0;gap:8px}
.toolbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-height:36px}
.tgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tsep{width:1px;height:22px;background:var(--line-1);flex:none}
.stage{position:relative;flex:1;min-height:0;border-radius:var(--r-3);background:var(--stage);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-1)}
.stage.space{background:var(--space-1);box-shadow:none}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.status{margin:0;padding:2px 2px 0 14px;min-height:48px;font-size:15px;line-height:1.55;color:var(--text-1);position:relative}
.status::before{content:'';position:absolute;left:0;top:6px;bottom:4px;width:3px;border-radius:2px;background:linear-gradient(var(--a),var(--b))}
.status b{font-weight:700}
.status .ex{color:var(--text-2)}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);overflow:hidden}
.panel-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 14px 14px;scrollbar-gutter:stable}
.panel-foot{border-top:1px solid var(--line-1);padding:10px 14px 12px;background:var(--surface-1);display:grid;gap:8px}
.pg+.pg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-1)}
.pg-title{font:700 13px/1.3 var(--font-ui);color:var(--text-2);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pg-row .pg-title{margin:0}
.help{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.help b{color:var(--text-1)}
.linkbtn{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 6px;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);font:600 12px/1 var(--font-ui);cursor:pointer;position:relative}
.linkbtn::before{content:'';position:absolute;inset:-7px -2px}
.linkbtn svg.ic{width:15px;height:15px}
@media (hover:hover) and (pointer:fine){.linkbtn:hover{color:var(--text-1);background:var(--surface-2)}}

/* 컨트롤 */
.tool{position:relative;display:inline-flex;align-items:center;gap:6px;height:var(--control-h);padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-1);color:var(--text-1);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.tool::before{content:'';position:absolute;inset:-5px -2px}
.tool svg.ic{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-2);font-weight:800}
.tool.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.tool.save{margin-left:auto;border-color:transparent;background:transparent;color:var(--text-2)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool[aria-busy="true"]{opacity:.55;cursor:progress}
.tool:active:not(:disabled){transform:scale(.96)}
.tool .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (hover:hover) and (pointer:fine){.tool:hover:not(:disabled):not(.primary){background:var(--surface-2)}}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
.seg button{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--shadow-1),inset 0 -2px 0 var(--text-1)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-3px 0}
.btn svg.ic{width:17px;height:17px}
.btn.primary{min-height:42px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.small{min-height:34px;padding:0 10px}
.btn.small::before{inset:-5px 0}
.btn.wide{width:100%}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-2);font-weight:800}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled):not(.primary){background:var(--surface-2)}}
.rng{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.rng input{width:150px;min-height:32px}
.rng output{min-width:56px;font:800 15px/1 var(--font-ui);color:var(--text-1);font-variant-numeric:tabular-nums}
input[type=range]{cursor:pointer}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.vrow input{width:100%;min-height:32px}
.vrow output{min-width:64px;text-align:right;font:800 15px/1 var(--font-ui);color:var(--text-1);font-variant-numeric:tabular-nums}
.vrow label{font:700 13px/1 var(--font-ui);color:var(--text-2)}
.check{display:flex;gap:9px;align-items:center;min-height:40px;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px}
.check.tight{min-height:32px}
.shutter{position:absolute;inset:0;background:var(--surface-1);opacity:0;pointer-events:none;animation:shutter .32s ease-out;z-index:8}
@keyframes shutter{25%{opacity:.6}100%{opacity:0}}

/* 관측 노트(오른쪽 칸) */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px 0}
.step+.step{border-top:1px solid var(--line-1)}
.step .cn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);font:800 12px/1 var(--font-ui);color:var(--text-2)}
.step[data-done="true"] .cn{background:var(--text-1);border-color:var(--text-1);color:var(--surface-1)}
.step .st{font:600 13px/1.4 var(--font-ui);color:var(--text-1)}
.step .sa{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step .sv{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.gauge svg{width:112px;height:66px}
.gv{font:800 26px/1.1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--text-1)}
.gv small{font-size:15px;font-weight:600;color:var(--text-2);margin-left:2px}
.gl{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{padding:8px 10px;border-radius:var(--r-2);background:var(--surface-0);border:1px solid var(--line-1)}
.meter span{display:block;font:600 12px/1.25 var(--font-ui);color:var(--text-2)}
.meter b{font:800 20px/1.3 var(--font-ui);color:var(--text-1);font-variant-numeric:tabular-nums}
.meter small{font:700 12px/1 var(--font-ui);color:var(--text-2);margin-left:2px}
.meter.a{box-shadow:inset 3px 0 0 var(--a)}.meter.b{box-shadow:inset 3px 0 0 var(--b)}.meter.p{box-shadow:inset 3px 0 0 var(--px)}
.rec{width:100%;border-collapse:collapse;font-size:13px}
.rec th{font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:left;padding:5px 4px;border-bottom:1px solid var(--line-2);vertical-align:bottom}
.rec th.num,.rec td.num{text-align:right;white-space:nowrap}
.rec td{padding:6px 4px;border-bottom:1px solid var(--line-1);vertical-align:middle;line-height:1.4}
.rec td.nm{font-weight:700;white-space:nowrap}
.rec .muted{color:var(--text-2)}
.rec tr.fresh td{background:color-mix(in oklab,var(--ok) 12%,transparent)}
.rec .del{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer;position:relative}
.rec .del::before{content:'';position:absolute;inset:-7px -2px}
.empty{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.chart{display:block;width:100%;height:auto;margin-top:6px}
.chart text{font-family:var(--font-ui)}
.starlist{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.starbtn{position:relative;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;align-items:center;min-height:44px;padding:5px 8px;border:1px solid var(--line-1);border-radius:var(--r-1);background:var(--surface-0);color:var(--text-1);text-align:left;cursor:pointer}
.starbtn .sd{grid-row:span 2;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 25%,transparent)}
.starbtn b{font:700 13px/1.2 var(--font-ui)}
.starbtn small{font:500 12px/1.2 var(--font-ui);color:var(--text-2)}
.starbtn[aria-pressed="true"]{border-color:var(--text-1);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--text-1)}
.starbtn .ok{position:absolute;right:6px;top:6px;width:14px;height:14px;color:var(--ok)}

/* ⑤ 탐구 질문 */
.lab-quiz{grid-template-rows:auto minmax(0,1fr)}
.quiz-list{overflow:auto;min-height:0;display:grid;gap:10px;align-content:start;padding:0 2px 8px;overscroll-behavior:contain;scrollbar-gutter:stable}
.policy{padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-1);font-size:13px;line-height:1.6}
.policy p{margin:0}
.policy .save-note{color:var(--text-2);margin-top:2px}
.qcard{border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1)}
.qcard summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;min-height:52px}
.qcard summary::-webkit-details-marker{display:none}
.qn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:800 13px/1 var(--font-ui)}
.qt{font:800 15px/1.35 var(--font-ui)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.badge{padding:3px 8px;border-radius:var(--r-full);font:700 12px/1.2 var(--font-ui);border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.lock{background:var(--ok-soft);color:var(--text-1);border-color:transparent}
.badge.rev{background:var(--rev-soft);color:var(--text-1);border-color:transparent}
.badge.hint{background:var(--warn-soft);color:var(--text-1);border-color:transparent}
.chev{color:var(--text-2);transition:transform var(--dur-fast) var(--ease-out)}
.qcard[open] .chev{transform:rotate(90deg)}
.qbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:2px 14px 16px;align-items:start}
figure.mini{margin:0;position:sticky;top:0;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--stage);overflow:hidden}
figure.mini.space{background:var(--space-1)}
.mini figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:8px 10px;border-bottom:1px solid var(--line-1);background:var(--surface-1);font-size:13px}
.mini figcaption b{font-weight:800}
.tag{padding:2px 8px;border-radius:var(--r-full);background:var(--px-soft);color:var(--text-1);font:800 12px/1.3 var(--font-ui)}
.how{flex-basis:100%;color:var(--text-2);font-size:12px;line-height:1.45}
.mini-stage{position:relative;width:100%;aspect-ratio:16/10;max-height:300px}
.mini-stage>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.mini-result{margin:0;padding:8px 10px;min-height:46px;font-size:13px;line-height:1.5;border-top:1px solid var(--line-1);background:var(--surface-1);font-variant-numeric:tabular-nums}
.mini-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line-1);background:var(--surface-1)}
.mc-range{display:flex;align-items:center;gap:6px;flex:1;min-width:190px;font:600 12px/1 var(--font-ui);color:var(--text-2)}
.mc-range input{flex:1;min-width:0;min-height:32px}
.mc-range output{min-width:56px;text-align:right;font:800 13px/1 var(--font-ui);color:var(--text-1);font-variant-numeric:tabular-nums}
.qq{margin:0 0 4px;font:600 15px/1.65 var(--font-ui)}
.qsrc{margin:0 0 10px;font-size:12px;color:var(--text-2)}
.alabel{display:block;font:800 13px/1.3 var(--font-ui);margin-bottom:5px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0);color:var(--text-1);font-size:16px;line-height:1.6;resize:vertical}
textarea.locked{background:var(--surface-2);color:var(--text-2)}
.arow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;font-size:12px;color:var(--text-2)}
.lockline{color:var(--text-1);font-weight:600}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.hintp,.modelp,.revp{margin-top:8px;padding:10px 12px;border-radius:var(--r-2);font-size:13px;line-height:1.65}
.hintp{background:var(--warn-soft)}
.hintp p,.modelp p{margin:0}
.hintp small{display:block;margin-top:4px;color:var(--text-2);font-size:12px}
.modelp{background:var(--ok-soft)}
.modelp p{font-size:15px;line-height:1.7}
.modelp h4,.revp h4{margin:0 0 4px;font:800 13px/1.3 var(--font-ui)}
mark{background:color-mix(in oklab,var(--ok) 28%,transparent);color:inherit;padding:0 2px;border-radius:3px}
.revp{background:var(--rev-soft)}
.revnote{margin:0 0 6px;font-size:12px;color:var(--text-2)}
.revp .cnt{display:block;margin-top:4px;font-size:12px;color:var(--text-2)}
.quiz-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 2px 14px}
.textlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--text-2);font:600 13px/1 var(--font-ui);text-decoration:none}
.textlink svg{width:20px;height:20px}
.textlink .yt-body{fill:currentColor}.textlink .yt-play{fill:var(--surface-0)}
.textlink:is(:hover,:focus-visible){color:var(--text-1)}
.textlink:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.textlink:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}

/* 창 */
.toast{position:fixed;left:50%;top:calc(var(--top-h) + 10px);transform:translateX(-50%);z-index:60;max-width:min(380px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-2);background:var(--text-1);color:var(--surface-0);font-size:13px;line-height:1.5;box-shadow:var(--shadow-3)}
.toast.error{background:var(--danger-soft);color:var(--text-1);border:1px solid var(--danger)}
.toast-act{flex:none;min-height:32px;padding:0 10px;border:1px solid currentColor;border-radius:var(--r-1);background:transparent;font:700 13px/1 var(--font-ui);cursor:pointer}
.toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer}
dialog{padding:0;border:1px solid var(--line-2);border-radius:var(--r-3);background:var(--surface-1);color:var(--text-1);width:min(560px,calc(100% - 32px));max-height:88dvh;box-shadow:var(--edge-hi),var(--shadow-3)}
dialog.wide{width:min(740px,calc(100% - 32px))}
dialog::backdrop{background:var(--scrim)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line-1)}
.dialog-head h2{font:800 18px/1.35 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 20px;max-height:calc(88dvh - 58px);overflow:auto;overscroll-behavior:contain}
.dialog-body p{margin:0 0 10px;line-height:1.7}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.dialog-actions.start{justify-content:flex-start}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.txt{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--text-2)}
label.txt input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
fieldset.opts{margin:12px 0 0;padding:8px 12px 4px;border:1px solid var(--line-1);border-radius:var(--r-2)}
fieldset.opts legend{padding:0 6px;font:800 13px/1 var(--font-ui)}
.wipe-list{margin:0 0 10px;padding-left:20px;line-height:1.7}
.fb{margin:0;min-height:20px;font-size:13px;line-height:1.5;font-weight:600;color:var(--text-2)}
.fb.bad{color:var(--warn)}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,34vw,470px);border-radius:var(--r-3) 0 0 var(--r-3);border-right:0}
dialog.drawer .dialog-body{max-height:calc(100dvh - 58px);padding-top:4px}
dialog.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 45%,transparent)}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
dialog.drawer.sheet{--lift:0px}
.dh-btn{min-height:32px;padding:0 9px;font-size:12px}
.help-doc h3{font:800 15px/1.35 var(--font-ui);margin:16px 0 6px}
.help-doc h3:first-child{margin-top:0}
.help-doc ol,.help-doc ul{margin:0;padding-left:20px;font-size:13px;line-height:1.7}
.help-doc p{font-size:13px}
.help-doc .keys{line-height:2.1}
.brandblock{padding:10px 12px;border-radius:var(--r-2);background:var(--surface-0);font-size:13px;line-height:1.7}
.brandblock a{color:var(--text-1)}
.ver-line{color:var(--text-2);font-size:12px!important}
.th-card{padding:14px 0 18px;border-bottom:1px solid var(--line-1)}
.th-card h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.th-fig{position:relative;height:210px;margin:4px 0 10px;background:var(--stage);border-radius:var(--r-2);overflow:hidden}
.th-fig.space{background:var(--space-1)}
.th-fig>svg{position:absolute;inset:0;width:100%;height:100%}
.th-def{font-weight:600;margin:0 0 6px;line-height:1.65}
.th-card ul{margin:0;padding-left:18px;font-size:15px;line-height:1.65}
.th-card .more{margin-top:8px;font-size:13px}
.th-card .more summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.th-link{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--px);background:var(--px-soft);font-size:13px;line-height:1.55}
.unitbox{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px;justify-content:start;margin:6px 0 4px;font:700 15px/1.4 var(--font-ui);font-variant-numeric:tabular-nums}

/* 장면 SVG 글자 — 화면 px 그대로(viewBox = 실제 px) */
.scene{touch-action:none;user-select:none;-webkit-user-select:none}
.scene text{font-family:var(--font-ui)}
.scene .t12{font-size:12px;font-weight:600}
.scene .t13{font-size:13px;font-weight:700}
.scene .t15{font-size:15px;font-weight:800}
.scene .t18{font-size:18px;font-weight:800}
.scene .num,.scene text.num{font-variant-numeric:tabular-nums}
.scene .halo{paint-order:stroke;stroke-linejoin:round}
.scene [data-drag]{cursor:grab}
.scene [data-drag]:focus{outline:none}
.scene [data-drag]:focus-visible .focus-ring{stroke:var(--focus);stroke-width:2;stroke-dasharray:4 3}
.scene .hit{cursor:pointer}
.mini-stage .scene{touch-action:pan-y}
.mini-stage .scene [data-drag]{touch-action:none}

/* 반응형 */
@media (max-width:1180px){.lab-head .goal{flex-basis:100%}}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .appbody{height:auto;min-height:calc(100dvh - var(--top-h))}
  .rail{position:sticky;top:0;height:calc(100dvh - var(--top-h))}
  main{overflow:visible}
  .lab{height:auto}
  .work,.work.solo{grid-template-columns:minmax(0,1fr)}
  .stage{flex:none;aspect-ratio:var(--ar,4/3)}
  .panel-scroll{overflow:visible}
  .panel-foot{position:sticky;bottom:0;z-index:5;box-shadow:0 -8px 20px -14px hsl(var(--shadow-color) / .6)}
  .qbody{grid-template-columns:minmax(0,1fr)}
  figure.mini{position:static}
  .quiz-list{overflow:visible}
  .head-seg{margin-left:0}
  .stage>.scene{touch-action:pan-y}
  .stage>.scene [data-drag]{touch-action:none}
}
@media (max-width:600px){
  :root{--top-h:52px}
  .topbar{gap:4px;padding:0 6px 0 8px}
  .brand{gap:4px}
  .brandmark{width:24px;height:24px}
  .word{font-size:12px}
  .brand .vdiv,.topbar>.vdiv,.top-title,.utilities .hsep,#reportBtn,#helpBtn{display:none}
  .social{width:36px;height:40px}
  .social::before{inset:-2px 4px}
  .social svg{width:19px;height:19px}
  .icon-btn{width:38px;height:40px}
  .icon-btn::before{inset:-2px 3px}
  .appbody{display:block;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:25;flex-direction:row;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line-1)}
  .rail button{flex:1;min-height:54px;gap:3px;padding:6px 0}
  .rail button svg.ic{width:21px;height:21px}
  .rail button .l,.rail .rn{display:none}
  .rail button .s{display:block}
  .rail button[aria-current="page"]::after{left:24%;right:24%;top:-4px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  main{padding:10px 0 16px}
  .lab{gap:8px}
  .lab-head{padding:0 12px}
  .toolbar{padding:0 10px}
  .stage{border-radius:0;box-shadow:none}
  .status{margin:0 12px}
  .panel{border-radius:0;border-left:0;border-right:0}
  .work{gap:10px}
  .tool.save span{display:none}
  .tool.save{width:44px;height:44px;padding:0;justify-content:center}
  .tsep{display:none}
  .rng input{width:120px}
  .panel-foot{bottom:calc(62px + env(safe-area-inset-bottom))}
  .quiz-list{padding:0 8px 8px}
  .qcard summary{padding:10px;flex-wrap:wrap}
  .badges{flex-basis:100%;justify-content:flex-start;order:3}
  .two-cols{grid-template-columns:1fr}
  .qbody{padding:2px 0 14px}
  figure.mini{border-radius:0;border-left:0;border-right:0}
  .qtext{padding:0 10px}
  dialog.drawer{width:100%;border-radius:0}
  .toast{top:auto;bottom:calc(76px + env(safe-area-inset-bottom))}
  .starlist{grid-template-columns:1fr 1fr}
}
@media (max-width:360px){.word{font-size:12px}.seg button{padding:0 8px}}
/* 사용자 설정 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}.chev{transition:none}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.toast{box-shadow:none}}

/* 인쇄 */
.printview{display:none}
#offscreen{position:fixed;left:-10000px;top:0;width:640px;visibility:hidden;pointer-events:none}
@media print{
  @page{size:A4 portrait;margin:13mm 12mm}
  html,body{height:auto!important;overflow:visible!important;background:var(--surface-1)!important}
  body>*:not(.printview){display:none!important}
  .printview{display:block!important;color:var(--text-1)}
  .pv{font:400 10.5pt/1.55 var(--font-ui)}
  .pv-kick{margin:0;font-size:9pt;color:var(--text-2);font-weight:600}
  .pv h1{font:800 17pt/1.3 var(--font-ui);margin:2px 0 8px}
  .pv-id{display:flex;gap:18px;padding:6px 0;border-top:1.5px solid var(--text-1);border-bottom:1px solid var(--line-2);font-size:10.5pt}
  .pv-id.blank i{display:inline-block;width:110px;border-bottom:1px solid var(--text-1);margin-left:6px;height:14px}
  .pv-policy{margin:4px 0 0;font-size:9pt;color:var(--text-2)}
  .pv-sec{margin-top:14px}
  .pv-sec h2{font:800 12pt/1.3 var(--font-ui);margin:0 0 6px}

    const S = this.S, ox = this.ox, atA = Math.abs(ox - S.A) < .06, atB = Math.abs(ox - S.B) < .06;
    return `<g clip-path="url(#${P}-cv)">${this.scene3d(this.cam(v, ox), v)}${this.mini ? '' : chip(v.x + 10, v.y + 10, atA ? `A ${S.where}에서 본 모습` : atB ? `B ${S.where}에서 본 모습` : '보이는 모습 · 지금 자리', atA ? '--a-glow' : atB ? '--b-glow' : null)}</g>`;

  scene3d(c, box) { return this.s.scene === 'class' ? this.classView(c, box) : this.campView(c, box); }
  /* 앞 평면(y 일정)의 한 점 */
  P3(c, x, y, z) { return [c.cx + c.F * (x - c.ox) / y, c.cy - c.F * (z - c.eyeZ) / y]; }
  poly3(c, p3, fill, extra = '') {
    const out = [];
    for (let i = 0; i < p3.length; i++) {
      const a = p3[i], b = p3[(i + 1) % p3.length], ain = a[1] >= c.near, bin = b[1] >= c.near;
      if (ain) out.push(a);
      if (ain !== bin) { const t = (c.near - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * t, c.near, a[2] + (b[2] - a[2]) * t]); }
    }
    if (out.length < 3) return '';
    return `<polygon points="${pts(out.map(p => this.P3(c, p[0], p[1], p[2])))}" fill="${fill}"${extra}/>`;
  }
  line3(c, a, b, stroke, w, extra = '') {
    if (a[1] < c.near && b[1] < c.near) return '';
    const cl = (p, q) => { if (p[1] >= c.near) return p; const t = (c.near - p[1]) / (q[1] - p[1]); return [p[0] + (q[0] - p[0]) * t, c.near, p[2] + (q[2] - p[2]) * t]; };
    const A2 = this.P3(c, ...cl(a, b)), B2 = this.P3(c, ...cl(b, a));
    return `<line x1="${f1(A2[0])}" y1="${f1(A2[1])}" x2="${f1(B2[0])}" y2="${f1(B2[1])}" stroke="${stroke}" stroke-width="${w}"${extra}/>`;
  }
  /* 앞을 보고 선 평면(깊이 y) 위에 m 단위로 그리는 묶음: 로컬 (x, −z) */
  flat(c, x0, y, z0, inner) { const k = c.F / y, p = this.P3(c, x0, y, z0); return `<g transform="translate(${f1(p[0])} ${f1(p[1])}) scale(${Math.round(k * 1000) / 1000})">${inner}</g>`; }
  classView(c, box) {
    const Y = 6.95, H = 2.9, X = 3.4, nr = .4, P = this.P;

    // 창문(왼쪽 벽) · 게시판(오른쪽 벽)

  campView(c, box) {

  /* ── 글로 읽는 상태 ── */
  observe() {

    const pair = cls ? `A 자리에서는 선생님이 ${this.hideClause(S.A, false)}, B 자리에서는 ${this.hideClause(S.B, true)}.`

    if (atEnd) return { obs: pair, ex };

/* ═════════════════ ② 시차 측정 판 — 교과서 탐구 ‘물체까지의 거리와 시차의 관계’ ═════════════════
   단위 mm(1 SVG 기준 = 1 mm × k px). 판 270 × 180 mm, 앞쪽 접은 면에 구멍 두 개(간격 80 mm),
   뒤쪽 접어 세운 면(y = 180)에 번호 눈금 ①~⑪(24 mm 간격).
   위 띠 ‘구멍으로 본 모습’은 뒤쪽 세운 면에 비친 모습이라 x축이 아래 판 그림과 정확히 맞는다. */
const BOARD = {

    const busy = vis ? dots.map(([p, , yy]) => { const [lo, hi] = trail(p); return [this.cx + lo * this.k0 - 11, yy - 11, this.cx + hi * this.k0 + 11, yy + 11]; }) : [];
    const meets = b => busy.some(r => r[0] < b[2] && r[2] > b[0] && r[1] < b[3] && r[3] > b[1]);
    const two = this.mini && meets([st.x + 8, y0 + 8, st.x + 8 + cw, y0 + 32]);
    const chip = two ? [st.x + 8, y0 + 6, st.x + 8 + cw2, y0 + 40] : [st.x + 8, y0 + 8, st.x + 8 + cw, y0 + 32];
    h += `<rect${A({ x: chip[0], y: chip[1], width: chip[2] - chip[0], height: chip[3] - chip[1], rx: two ? 10 : 12, fill: T('--stage-chip-bg'), 'fill-opacity': .82 })}/>`;
    h += two ? label(st.x + 16, y0 + 20, '지구에서', { anchor: 'start', fill: T('--on-stage-2'), cls: 't12' }) + label(st.x + 16, y0 + 35, '본 하늘', { anchor: 'start', fill: T('--on-stage-2'), cls: 't12' })
      : label(st.x + 17, y0 + 25, tx, { anchor: 'start', fill: T('--on-stage-2'), cls: 't12' });
    // 띠가 낮은 작은 그림은 별 이름을 점 옆(같은 높이)에 적는다 — 점 아래에 적으면 띠 밖으로 잘리거나 다른 별 점 밑에 놓인다
    const side = this.mini && h0 * .3 < 20;
    const one = (star, yy, glow, nm, col) => {
      let s2 = '';
      // 1년 동안 오가는 범위(자취)
      const [lo, hi] = trail(star);
      s2 += `<line${A({ x1: this.cx + lo * this.k0, x2: this.cx + hi * this.k0, y1: yy, y2: yy, stroke: T('--on-stage-2'), 'stroke-opacity': .45, 'stroke-width': 2, 'stroke-dasharray': '1 5', 'stroke-linecap': 'round' })}/>`;
      // 관측한 자리 X1 · X2
      [['A', '--a-glow', 1], ['B', '--b-glow', 2]].forEach(([w, c, n]) => {
        if (!this.s.obs[w]) return;
        const xx = this.cx + this.appX(this.earthAt(w === 'A' ? 0 : 6), star) * this.k0;
        s2 += `<circle${A({ cx: xx, cy: yy, r: 9, fill: 'none', stroke: T(c), 'stroke-width': 2 })}/><text${A({ x: xx, y: yy - 13, 'text-anchor': 'middle', fill: T(c) })} class="t13">${this.sub(nm, n)}</text>`;
      });
      const xn = this.cx + this.appX(this.E(), star) * this.k0;
      s2 += `<circle${A({ cx: xn, cy: yy, r: 11, fill: `url(#${P}-${glow})` })}/><circle${A({ cx: xn, cy: yy, r: 3.2, fill: T('--star-1') })}/>`;
      // 이름표가 다른 별 점(또는 칩)을 덮으면 반대쪽으로 뒤집는다
      const lw = 28;
      const hit = side ? x1 => dots.some(([p, ox, oy]) => p !== star && ox > x1 - 6 && ox < x1 + lw + 6 && Math.abs(oy - yy) < 18) || (chip[0] < x1 + lw && chip[2] > x1 && chip[1] < yy + 8 && chip[3] > yy - 8)
        : x1 => dots.some(([p, ox, oy]) => p !== star && ox > x1 - 4 && ox < x1 + lw + 4 && oy > yy + 1 && oy < yy + 24);
      const gap = side ? 13 : 12, right = !hit(xn + gap) || hit(xn - gap - lw);
      s2 += label(right ? xn + gap : xn - gap, side ? yy + 4.5 : yy + 17, `별 ${nm}`, { anchor: right ? 'start' : 'end', fill: T('--on-stage-1'), cls: 't12' });
      return s2;
    };
    if (vis) {
      if (this.s.showY) h += one(this.starY(), yY, 'glowY', this.nY, '--star-hot');
      h += one(this.starX(), yX, 'glow', this.nX, '--star-2');
    } else {
      const xn = this.cx;
      h += `<circle${A({ cx: xn, cy: yX, r: 11, fill: `url(#${P}-glow)` })}/><circle${A({ cx: xn, cy: yX, r: 3.2, fill: T('--star-1') })}/>`;
      h += label(xn, yX + 30, this.z > .98 ? `실제로는 1월과 7월 사이에 ${fmtAngle(this.parX())}만큼만 옮겨 보여요 — 이 그림으로는 보이지 않을 만큼 작아요` : '별까지의 거리를 실제 비율로 늘리는 중…', { fill: T('--on-stage-1'), cls: 't13' });
    }
    return h + `</g>`;
  }
  drawMap() {
    const P = this.P, k = this.kz(), s = this.s, sx = x => this.sx(x), sy = y => this.sy(y), mini = this.mini;
    let h = `<g clip-path="url(#${P}-cm)">`;
    // 먼 별들이 붙은 띠(경계)
    const by = this.mapTop;
    if (this.z < .5) h += `<line${A({ x1: 0, x2: this.W, y1: by, y2: by, stroke: T('--on-stage-2'), 'stroke-opacity': .45 * (1 - this.z * 2), 'stroke-dasharray': '2 6' })}/>` + (mini ? '' : label(this.W - 14, by + 16, '아주 멀리 있는 별들 쪽', { anchor: 'end', fill: T('--on-stage-2'), cls: 't12' }));
    // 태양 · 궤도
    const Sx = sx(0), Sy = sy(0), R = Math.max(.8, k);
    h += `<circle${A({ cx: Sx, cy: Sy, r: Math.max(10, .3 * k) * 1.9, fill: `url(#${P}-sun)` })}/><circle${A({ cx: Sx, cy: Sy, r: Math.max(5, .14 * k), fill: T('--sun-1') })}/>`;
    const sunL = Sy + Math.max(26, .3 * k * 1.9) + 4;                 // 작은 그림에서 그림 아래 끝을 넘으면 적지 않는다
    if ((!mini || R > 10) && (!mini || sunL + 1 <= this.H)) h += label(Sx, sunL, '태양', { fill: T('--on-stage-2'), cls: 't12' });
    h += `<circle${A({ cx: Sx, cy: Sy, r: R, fill: 'none', stroke: T('--orbit'), 'stroke-opacity': .7, 'stroke-width': 1.2, 'stroke-dasharray': '3 4' })}/>`;
    if (R > 30) {
      for (let i = 0; i < 12; i++) { const a = 2 * Math.PI * i / 12, c = Math.cos(a), sn = -Math.sin(a); h += `<line${A({ x1: Sx + c * (R - 4), y1: Sy + sn * (R - 4), x2: Sx + c * (R + 4), y2: Sy + sn * (R + 4), stroke: T('--orbit'), 'stroke-opacity': .6 })}/>`; }
      if (!mini) [[3, '4월', -17], [9, '10월', 18]].forEach(([i, t, o]) => { const a = 2 * Math.PI * i / 12; h += label(Sx + Math.cos(a) * (R + o), Sy - Math.sin(a) * (R + o) + 4, t, { fill: T('--on-stage-2'), cls: 't12' }); });
      // A · B 자리
      const nmd = this.o.names;                          // 간이 실험(별 이름 A·B)에서는 관측 위치를 버튼과 같은 (가)·(나)로
      [[0, mini ? (nmd ? '(가) 1월' : 'A') : 'A · 1월', '--a-glow'], [6, mini ? (nmd ? '(나) 7월' : 'B') : 'B · 7월', '--b-glow']].forEach(([m, t, c]) => { const e = this.earthAt(m), X = sx(e[0]) + (m ? -1 : 1) * (mini ? 14 : 16), Y = sy(e[1]) + (mini ? 18 : 26); h += label(X, Y, t, { anchor: m ? 'end' : 'start', fill: T(c), halo: T('--space-1'), cls: mini ? 't13' : 't15' }); });
    } else if (mini && R > 10) {
      // 궤도가 작은 그림(이론 카드 · 화면의 간이 실험)은 월 눈금 없이 관측 자리만 궤도 바깥 옆(같은 높이)에 적는다
      const nmd = this.o.names;
      [[0, nmd ? '(가) 1월' : 'A', '--a-glow'], [6, nmd ? '(나) 7월' : 'B', '--b-glow']].forEach(([m, t, c]) => { const e = this.earthAt(m); h += label(sx(e[0]) + (m ? -1 : 1) * 10, sy(e[1]) + 4.5, t, { anchor: m ? 'end' : 'start', fill: T(c), halo: T('--space-1'), cls: 't13' }); });
    }
    // 시선
    const Xs = this.starX(), Ys = this.starY(), E = this.E();
    const ray = (from, star, col, w, dash, toBand = true) => {
      const X1 = sx(from[0]), Y1 = sy(from[1]), X2 = sx(star[0]), Y2 = sy(star[1]);
      let r = `<line${A({ x1: X1, y1: Y1, x2: X2, y2: Y2, stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' })}/>`;
      if (toBand && this.z < .02) { const bx = this.appX(from, star); r += `<line${A({ x1: X2, y1: Y2, x2: sx(bx), y2: by, stroke: col, 'stroke-width': w, 'stroke-dasharray': dash || '5 5' })}/><circle${A({ cx: sx(bx), cy: by, r: 3.5, fill: col })}/>`; }
      return r;
    };
    if (this.z < .02) {
      if (s.showY && (s.obs.A || s.obs.B)) { if (s.obs.A) h += ray(this.earthAt(0), Ys, T('--a-glow'), 1.2, '2 5'); if (s.obs.B) h += ray(this.earthAt(6), Ys, T('--b-glow'), 1.2, '2 5'); }
      if (s.obs.A) h += ray(this.earthAt(0), Xs, T('--a-glow'), 2.4);
      if (s.obs.B) h += ray(this.earthAt(6), Xs, T('--b-glow'), 2.4);
      h += ray(E, Xs, T('--on-stage-1'), 1.4, '2 4');
    } else {
      h += ray(this.earthAt(0), Xs, T('--a-glow'), 1.6, null, false) + ray(this.earthAt(6), Xs, T('--b-glow'), 1.6, null, false);
    }
    // 시차 · 연주 시차 호
    if (s.obs.A && s.obs.B) {
      const cx = sx(Xs[0]), cy = sy(Xs[1]);
      const aA = Math.atan2(sy(0) - cy, sx(1) - cx), aB = Math.atan2(sy(0) - cy, sx(-1) - cx), aS = Math.PI / 2;
      const r1 = mini ? 26 : 38, r2 = mini ? 17 : 26;
      h += `<path d="${smallArc(cx, cy, r1, aA, aB)}" fill="none" stroke="${T('--px-glow')}" stroke-width="3" stroke-linecap="round"/>`;
      h += `<line${A({ x1: cx, y1: cy, x2: Sx, y2: Sy, stroke: T('--on-stage-2'), 'stroke-opacity': .6, 'stroke-dasharray': '1 4' })}/>`;
      h += `<path d="${smallArc(cx, cy, r2, aS, aA)}" fill="none" stroke="${T('--px-glow')}" stroke-width="5" stroke-opacity=".55" stroke-linecap="round"/>`;
      if (!mini) {
        const p = this.parX();
        h += label(cx - r1 - 10, cy + r1 * .55 + 22, `시차 ${fmtAngle(p)}`, { anchor: 'end', fill: T('--px-glow'), halo: T('--space-1'), cls: 't15 num' });
        h += label(cx + r1 + 10, cy + r1 * .55 + 22, `연주 시차 ${fmtAngle(p / 2)}`, { anchor: 'start', fill: T('--px-glow'), halo: T('--space-1'), cls: 't15 num' });
      }
    }
    // 별 X · Y
    const starG = (p, glow, nm, big) => {
      const X = sx(p[0]), Y = sy(p[1]);
      return `<circle${A({ cx: X, cy: Y, r: big ? 18 : 13, fill: `url(#${P}-${glow})` })}/><circle${A({ cx: X, cy: Y, r: big ? 4.5 : 3.5, fill: T('--star-1') })}/>` + label(X + (big ? 14 : 11), Y - 8, nm, { anchor: 'start', fill: T('--on-stage-1'), halo: T('--space-1'), cls: mini ? 't12' : 't13' });
    };
    if (s.showY && this.z < .02) h += starG(Ys, 'glowY', `별 ${this.nY}`, false);
    h += starG(Xs, 'glow', this.z > .98 ? `별 ${this.nX} = ${ORB.realName}` : `별 ${this.nX}`, true);
    // 지구
    const ex = sx(E[0]), ey = sy(E[1]), er = this.z < .02 ? (mini ? 6 : 8) : 5;
    h += `<circle${A({ cx: ex, cy: ey, r: er, fill: `url(#${P}-earth)` })}/><path d="M${f1(ex - er * .5)} ${f1(ey - er * .2)} q${f1(er * .4)} ${f1(-er * .5)} ${f1(er * .8)} ${f1(-er * .1)} q${f1(-er * .1)} ${f1(er * .5)} ${f1(-er * .5)} ${f1(er * .5)}z" fill="${T('--earth-land')}"/>`;
    if ((!mini || this.o.names) && this.z < .02) h += label(ex, ey - 13, '지구', { fill: T('--on-stage-1'), halo: T('--space-1'), cls: 't12' });
    // 작은 그림(간이 실험·이론 카드·인쇄)에도 확대 모형임을 밝힌다
    if (mini && this.z < .02) h += label(8, this.H - 22, '확대 모형', { anchor: 'start', fill: T('--on-stage-2'), halo: T('--space-1'), cls: 't12' }) + label(8, this.H - 8, '(거리 비율 다름)', { anchor: 'start', fill: T('--on-stage-2'), halo: T('--space-1'), cls: 't12' });
    // 축척 막대(실제 비율 보기)
    if (this.z > 0 && !mini) {
      const want = 100 / k, p10 = Math.pow(10, Math.floor(Math.log10(want))), unit = [1, 2, 5, 10].map(u => u * p10).find(u => u >= want) || p10 * 10;
      const L = unit * k, x0 = 20, y0 = this.H - 26;
      h += `<path d="M${x0} ${y0 - 6} v6 h${f1(L)} v-6" fill="none" stroke="${T('--on-stage-1')}" stroke-width="1.5"/>` + label(x0 + L + 8, y0 + 4, `${unit >= 10000 ? (unit / 10000).toLocaleString() + '만' : unit.toLocaleString()} AU`, { anchor: 'start', fill: T('--on-stage-1'), cls: 't13 num' });
      h += label(this.W / 2, this.H - 12, `지구 공전 궤도(지름 2 AU)는 이제 ${(2 * k).toPrecision(2)} px — 점보다 작아요`, { fill: T('--on-stage-2'), cls: 't12' });
    }
    return h + `</g>`;
  }
  observeText() {
    const s = this.s;
    if (this.z > .98) return { obs: `실제 비율: ${ORB.realName}까지는 태양–지구 거리의 약 ${Math.round(ORB.realAU / 1000) / 10}만 배예요. 두 시선이 거의 겹쳐 시차는 ${fmtAngle(this.parX())}, 연주 시차는 ${fmtAngle(this.parX() / 2)}예요.`, ex: '확대 모형으로 돌아가려면 ‘실제 거리로 보기’를 다시 눌러요.' };
    if (this.z > 0) return { obs: '별까지의 거리를 실제 비율로 바꾸는 중이에요…', ex: '' };

    let obs = `지구가 ${this.monthName()} 위치에 있어요. 별 X는 먼 별들 사이 ${rel < -.05 ? '왼쪽' : rel > .05 ? '오른쪽' : '가운데'}에 보여요.`;
    if (s.obs.A && s.obs.B) obs = `A(1월)와 B(7월)에서 본 별 X의 방향이 달라요. 시차 ∠AXB ${fmtAngle(this.parX())}, 연주 시차 ${fmtAngle(this.parX() / 2)}${s.showY ? ` · 별 Y의 연주 시차 ${fmtAngle(this.parY() / 2)}` : ''}.`;
    else if (s.obs.A) obs += ' A(1월)에서 관측했어요. 이제 6개월 뒤 B에서 관측해요.';
    else if (s.obs.B) obs += ' B(7월)에서 관측했어요. A(1월)에서도 관측해요.';
    return { obs, ex: `별 X는 태양–지구 거리의 ${f1(s.dX)}배(확대 모형)` };
  }
  status() {
    const s = this.s, o = this.observeText();
    return { cond: `지구 공전 모형(확대) · 별 X ${this.z > .98 ? ORB.realName + ' 실제 비율' : '태양–지구 거리의 ' + f1(s.dX) + '배'}${s.showY && this.z < .02 ? ' · 별 Y ' + f1(ORB.dY) + '배' : ''} · 지구 ${this.monthName()}`, state: o.obs };
  }
}

/* ═════════════════ ④ 연주 시차로 별까지의 거리 비교 — 6개월 간격 사진 ═════════════════
   사진의 가로 = 2.4″(각도). 가까운 별은 1월 사진에서 −p, 7월 사진에서 +p 자리에 보여 모두 2p(시차)만큼 옮겨 간다.
   먼 별들은 움직이지 않는다(너무 멀어 시차가 0에 가깝다). 별의 고유 운동은 빼고 연주 시차만 나타냈다. */
const SKY = { fov: 2.4, blur: .018, blink: .8 };
class SkyLab extends Scene {
  constructor(host, o = {}) {
    super(host, o);
    this.s = Object.assign({ mode: 'gaia', photo: 'jan', star: 'sirius', meas: {} }, JSON.parse(JSON.stringify(o.state || {})));
    this.t = 0; this.flash = 0;
    this.svg.setAttribute('aria-label', '6개월 간격으로 찍은 별 사진 — 1월 사진과 7월 사진');
    this.build();
  }
  build() {
    const P = this.P;
    this.svg.innerHTML = `<defs>
      <clipPath id="${P}-cp"><rect id="${P}-cpr"/></clipPath>
      <radialGradient id="${P}-sg"><stop offset="0" stop-color="${T('--star-1')}"/><stop offset=".3" stop-color="${T('--star-1')}" stop-opacity=".85"/><stop offset="1" stop-color="${T('--star-2')}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${P}-sgh"><stop offset="0" stop-color="${T('--star-1')}"/><stop offset=".3" stop-color="${T('--star-hot')}" stop-opacity=".85"/><stop offset="1" stop-color="${T('--star-hot')}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${P}-sgr"><stop offset="0" stop-color="${T('--star-1')}"/><stop offset=".3" stop-color="${T('--star-red')}" stop-opacity=".85"/><stop offset="1" stop-color="${T('--star-red')}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${P}-bg"><stop offset="0" stop-color="${T('--bgstar')}"/><stop offset="1" stop-color="${T('--bgstar')}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${P}-sun"><stop offset="0" stop-color="${T('--sun-1')}"/><stop offset="1" stop-color="${T('--sun-3')}" stop-opacity="0"/></radialGradient>
    </defs><rect id="${P}-back"/><g id="${P}-ph"></g><g id="${P}-in"></g>`;
    this.gPh = this.svg.querySelector(`#${P}-ph`); this.gIn = this.svg.querySelector(`#${P}-in`);
  }
  refreshDefs() { this.build(); this.layout(); }
  layout() {
    const W = this.W, H = this.H, pad = this.mini ? 0 : 0;
    this.ph = { x: pad, y: pad, w: W - 2 * pad, h: H - 2 * pad };
    this.kas = this.ph.w / SKY.fov;                       // px per ″
    const b = this.svg.querySelector(`#${this.P}-back`); Object.entries({ x: 0, y: 0, width: W, height: H, fill: T('--space-0') }).forEach(([a, v]) => b.setAttribute(a, v));
    const c = this.svg.querySelector(`#${this.P}-cpr`); Object.entries({ x: this.ph.x, y: this.ph.y, width: this.ph.w, height: this.ph.h }).forEach(([a, v]) => c.setAttribute(a, v));
  }
  X(as) { return this.ph.x + this.ph.w / 2 + as * this.kas; }
  Y(as) { return this.ph.y + this.ph.h / 2 - as * this.kas; }
  /* ── 과학 값 ── */
  targets() {
    if (this.s.mode === 'gaia') return [GAIA.A, GAIA.B].map(g => ({ id: g.id, name: g.name, short: g.id, p: g.p, x: g.x, y: g.y, mag: 2.2, col: '--star-2' }));
    const st = STAR_BY[this.s.star]; return [{ id: st.id, name: st.name, short: st.name.replace(/\(.*\)/, ''), p: st.p, x: 0, y: .06, mag: st.mag, col: st.col }];
  }
  shift(t) { return 2 * t.p; }                                           // 1월 → 7월 옮겨 간 각(시차, ″)
  measured(t) { const v = this.shift(t); return v < PX.LIMIT ? null : Math.round(v * 100) / 100; }
  shownPhoto() { return this.s.photo === 'blink' ? (Math.floor(this.t / SKY.blink) % 2 ? 'jul' : 'jan') : this.s.photo; }
  /* ── 조작 ── */
  setMode(m) { if (m !== this.s.mode) { this.s.mode = m; this.dirty = true; } }
  setStar(id) { if (STAR_BY[id] && id !== this.s.star) { this.s.star = id; this.t = 0; this.dirty = true; } }
  setPhoto(p) { this.s.photo = p; this.t = 0; this.flash = .25; this.dirty = true; }
  markMeasured(id) { this.s.meas[id] = true; if (this.s.photo !== 'overlay') this.s.photo = 'overlay'; this.dirty = true; }
  step(dt) {

  drawPhoto() {

    for (let v = -Math.floor(hw * 10) / 10; v <= hw + 1e-9; v += .1) { const X = this.X(v), maj = Math.abs(v * 2 - Math.round(v * 2)) < 1e-6; h += `<line${A({ x1: X, x2: X, y1: ph.y, y2: ph.y + ph.h, stroke: T('--space-grid'), 'stroke-opacity': maj ? .9 : .45, 'stroke-width': maj ? 1 : .7 })}/>`; }
    for (let v = -Math.floor(hh * 10) / 10; v <= hh + 1e-9; v += .1) { const Y = this.Y(v), maj = Math.abs(v * 2 - Math.round(v * 2)) < 1e-6; h += `<line${A({ x1: ph.x, x2: ph.x + ph.w, y1: Y, y2: Y, stroke: T('--space-grid'), 'stroke-opacity': maj ? .9 : .45, 'stroke-width': maj ? 1 : .7 })}/>`; }
    if (!mini) for (let v = -1; v <= 1 + 1e-9; v += .5) h += label(this.X(v), ph.y + ph.h - 8, `${v > 0 ? '+' : ''}${v === 0 ? '0' : fx(v, 1)}″`, { fill: T('--on-stage-2'), cls: 't12 num' });

      const r = Math.max(1.1, (.5 + b * 1.4) * (k / 290));

    // 오른쪽 위 글자(눈금 값 · 별 이름) 자리: 가장 넓은 이름표(겹쳐 보기)와 한 줄에 들어가지 않으면
    // 실험대는 둘째 줄로, 작은 그림(간이 실험·이론 카드·인쇄)은 오른쪽 아래(축 글자가 없는 자리)로 옮긴다
    const gaia = this.s.mode === 'gaia', cwO = '두 사진 겹쳐 보기'.length * 13 + 20 + 110, rowY = ph.x + 10 + cwO + 8 <= ph.x + ph.w - 12 - 84 ? 27 : mini ? ph.h - 8 : 54;
    const nameTx = !gaia && !mini ? (st => `${st.name} · ${st.con}`)(STAR_BY[this.s.star]) : '';
    const boxes = [[ph.x + 10, ph.y + 10, ph.x + 10 + cwO, ph.y + 38], [ph.x + ph.w - 12 - 84, ph.y + rowY - 12, ph.x + ph.w - 12, ph.y + rowY + 3]];
    if (nameTx) boxes.push([ph.x + ph.w - 12 - nameTx.length * 13, ph.y + rowY + 7, ph.x + ph.w - 12, ph.y + rowY + 23]);
    const tw = (t, fs) => [...t].reduce((a, c) => a + (/[가-힣]/.test(c) ? fs : c === ' ' ? fs * .3 : fs * .6), 0);

          const v = this.measured(t), off = Math.max(26, SKY.blur * k * 4 + 16), vt = v == null ? '너무 작아 재기 어려워요' : `${fx(v, 2)}″`, fs = mini ? 12 : 15, mx = (xj + xl) / 2, lw = tw(vt, fs);
          const bx = [Math.min(xj, mx - lw / 2) - 2, Y - off - 7 - fs, Math.max(xl, mx + lw / 2) + 2, Y - off + 7];
          const up = Y - off - 7 - fs > ph.y + 2 && !boxes.some(b => bx[0] < b[2] && bx[2] > b[0] && bx[1] < b[3] && bx[3] > b[1]), by = up ? Y - off : Y + off, d = up ? 7 : -7;
          h += `<path d="M${f1(xj)} ${f1(by + d)} V${f1(by)} H${f1(xl)} V${f1(by + d)}" fill="none" stroke="${T('--px-glow')}" stroke-width="2"/>`;
          h += label(mx, up ? by - 7 : by + 18, vt, { fill: T('--px-glow'), halo: T('--space-0'), cls: mini ? 't12' : 't15 num' });
        }
      } else h += this.starBlob(show === 'jan' ? xj : xl, Y, t.mag, t.col);
      const lx = (show === 'overlay' ? Math.max(xj, xl) : show === 'jan' ? xj : xl) + Math.max(14, SKY.blur * k * 3.4);
      h += label(lx, Y + 5, this.s.mode === 'gaia' ? t.id : t.short, { anchor: 'start', fill: T('--on-stage-1'), halo: T('--space-0'), cls: mini ? 't13' : 't15' });

    // 사진 이름표

    const dot = show === 'jan' ? '--a-glow' : show === 'jul' ? '--b-glow' : null;
    const cw = tx.length * 13 + (dot ? 30 : 20) + (show === 'overlay' ? 110 : 0);

    if (dot) h += `<circle${A({ cx: ph.x + 24, cy: ph.y + 24, r: 5, fill: T(dot) })}/>`;

      h += `<circle${A({ cx: x2 + 6, cy: ph.y + 24, r: 6, fill: 'none', stroke: T('--a-glow'), 'stroke-width': 2 })}/>` + label(x2 + 16, ph.y + 29, '1월', { anchor: 'start', fill: T('--on-stage-1'), cls: 't12' });
      h += `<circle${A({ cx: x2 + 54, cy: ph.y + 24, r: 6, fill: 'none', stroke: T('--b-glow'), 'stroke-width': 2 })}/>` + label(x2 + 64, ph.y + 29, '7월', { anchor: 'start', fill: T('--on-stage-1'), cls: 't12' });

  /* 관측 위치(작은 공전 그림, 비율은 실제와 다름) */
  drawInset() {

    const x0 = W * .08, y0 = H - 26, R = Math.min(W * .84, (H - 50) / Math.sin(PX.rad(38)));
    const VA = PX.rad(38);                                     // 한 단위를 그리는 화면 각
    let h = `<rect width="${W}" height="${H}" fill="${T('--space-1')}"/>`;
    const pt = (a, r) => [x0 + r * Math.cos(a), y0 - r * Math.sin(a)];
    h += `<path d="M${f1(x0)} ${f1(y0)} L${pts([pt(0, R)])} A${f1(R)} ${f1(R)} 0 0 0 ${pts([pt(VA, R)])} Z" fill="${T('--on-stage-2')}" fill-opacity=".08" stroke="${T('--on-stage-2')}" stroke-opacity=".6"/>`;

    h += label(x0, 18, `${unitName} 돋보기 · ${sub}`, { anchor: 'start', fill: T('--on-stage-1'), cls: 't13' });
    // 연주 시차 부채꼴

    this.g.innerHTML = h; this.dirty = false;
  }
}

    }
  }
  build(stage) {
    if (this.L) this.saved = JSON.parse(JSON.stringify(this.L.s));

    this.L = this.make(stage); this.L.onChange = () => { this.changed = true; };

    if (this.ro) this.ro.disconnect();

        + `<label class="mc-range">별 모형까지 거리<input type="range" data-mini="dist" min="40" max="170" step="2" value="${s.da.y}" aria-label="구멍 선에서 별 모형까지 거리(mm)"><output class="num">${s.da.y} mm</output></label>`

      case 'gaiaMeasure': return this.seg('photo', [['jan', '(가) 1월'], ['jul', '(나) 7월'], ['blink', '번갈아 보기'], ['overlay', '겹쳐 보기']], s.photo, '사진 보기');

function miniPrintSvg(q) {
  // body가 아니라 <html>에 붙인다 — 인쇄 미디어의 ‘body>* 숨김’ 규칙에 걸리면 크기가 0이 되어 그림이 깨진다
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-10000px;top:0;width:560px;height:330px;visibility:hidden;display:block'; document.documentElement.appendChild(box);
  const m = new LabMini(q.mini, q.id), L = m.make(box, { print: true });
  L.resize(); if (L.step) for (let i = 0; i < 3; i++) L.step(1 / 60); L.draw();
  const svg = L.svg.cloneNode(true); svg.removeAttribute('width'); svg.removeAttribute('height');
  $$('[data-drag]', svg).forEach(g => g.remove());
  const out = svg.outerHTML.replace(/id="([^"]+)"/g, 'id="pv-$1"').replace(/url\(#/g, 'url(#pv-');
  box.remove(); return out;
}

/* ── 저장: 학습 기록은 sessionStorage, 기기 설정만 localStorage ── */
const KEY = n => `ssv-${LAB_ID}-${n}`;
const LEARN_KEYS = ['records', 'answers', 'revisions', 'locks', 'hints', 'seen'];
const store = {
  get(n, d) { try { const v = sessionStorage.getItem(KEY(n)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(n, v) {
    try { sessionStorage.setItem(KEY(n), JSON.stringify(v)); } catch (e) { }
    // 지난 기록을 불러올지 묻는 동안(keepPending)에는 사본을 덮어쓰지 않는다 — 새 학습 기록을 남기기 시작하면 이번 세션이 새 사본이 된다
    if (student.keepPending && LEARN_KEYS.includes(n)) { student.keepPending = false; try { sessionStorage.setItem(KEY('student'), JSON.stringify(student)); } catch (e) { } }
    mirror();
  },
  del(n) { try { sessionStorage.removeItem(KEY(n)); } catch (e) { } },
};
let student = store.get('student', { sid: '', name: '', asked: false, keep: false });
function mirror() {
  if (!student.keep || !student.sid || student.keepPending) return;
  clearTimeout(mirror.t);
  mirror.t = setTimeout(() => { try { const b = {}; LEARN_KEYS.forEach(k => { b[k] = store.get(k, null); }); localStorage.setItem(KEY('p-' + student.sid), JSON.stringify(b)); } catch (e) { } }, 300);
}

function announce(m) { const l = $('#live'); l.textContent = ''; requestAnimationFrame(() => { l.textContent = m; }); }
let toastT = 0, toastLast = '', toastN = 1;
function toast(msg, o = {}) {
  const el = $('#toast');
  if (msg === toastLast && !el.hidden) toastN++; else toastN = 1;
  toastLast = msg;
  el.innerHTML = `<span>${esc(msg)}${toastN > 1 ? ` <b class="num">×${toastN}</b>` : ''}</span>${o.action ? `<button class="toast-act">${esc(o.action)}</button>` : ''}${o.error ? `<button class="toast-x" aria-label="알림 닫기">${icon('x')}</button>` : ''}`;
  el.classList.toggle('error', !!o.error); el.hidden = false;
  if (o.action) el.querySelector('.toast-act').onclick = () => { el.hidden = true; o.onAction && o.onAction(); };
  const x = el.querySelector('.toast-x'); if (x) x.onclick = () => { el.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, o.error ? 7000 : (o.action ? 5000 : 2800));
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('ssv-theme', t); } catch (e) { }
  const next = t === 'dark' ? '라이트' : '다크', b = $('#themeBtn');
  b.setAttribute('aria-label', `${next} 모드로 전환 (D)`); b.setAttribute('title', `${next} 모드로 전환 (D)`);
  b.innerHTML = icon(t === 'dark' ? 'moon' : 'sun');
  $('#metaTheme').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--surface-1').trim());
  TOK.clear(); redrawAll();
}
function redrawAll() {
  if (cur.lab) { cur.lab.refreshDefs && cur.lab.refreshDefs(); cur.lab.draw(); }
  Object.values(minis).forEach(m => { if (m.L && m.el && m.el.isConnected) { m.L.refreshDefs && m.L.refreshDefs(); m.L.draw(); } });
  if ($('#drawer').open) renderTheory();
}
function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
function toggleFull() {
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); return; }
  const el = d.documentElement;
  if (!el.requestFullscreen || d.fullscreenEnabled === false) { toast('이 브라우저에서는 전체화면을 지원하지 않습니다. 브라우저의 화면 확대 기능을 써 주세요.', { error: true }); return; }
  el.requestFullscreen().catch(() => toast('전체화면으로 바꾸지 못했어요. 다시 눌러 보세요.', { error: true }));
}
function syncFull() {

}

  const mb = $(`[data-model="${qid}"]`);
  mb.disabled = !locked && len < MIN_CHARS; mb.title = mb.disabled ? `${MIN_CHARS}자 이상 쓰면 열 수 있어요` : '';

function learnSummary() {

  if (QUESTIONS.some(q => answers[q.id])) items.push('처음 쓴 답안');
  if (QUESTIONS.some(q => revisions[q.id])) items.push('다시 쓴 답안');

  if (QUESTIONS.some(q => hints[q.id])) items.push('힌트 기록');
  if (!items.length) items.push('지울 학습 기록이 아직 없어요');
  return items;
}

function restoreKept(sid, kept) {
  try {

/* ═══════════ 결과 저장 (PNG) ═══════════ */
const INLINE_PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'font-family', 'font-size', 'font-weight', 'text-anchor', 'paint-order', 'stop-color', 'stop-opacity', 'display', 'visibility', 'font-variant-numeric', 'dominant-baseline'];
function inlineTree(src, dst) {

}

  if (line) lines.push(line); return lines;
}
async function capture() {
  if (!isBench() || !cur.lab) return;
  const btn = $('#saveBtn'); if (!btn || btn.getAttribute('aria-busy') === 'true') return;
  askStudent('png', async () => {
    btn.setAttribute('aria-busy', 'true');
    const slow = setTimeout(() => toast('결과 이미지를 만드는 중이에요…'), 700);
    try {
      const L = cur.lab; L.draw();
      const lines = L.status(), title = SCREEN_BY[S.screen].title;
      const svg = L.svg, clone = svg.cloneNode(true);
      inlineTree(svg, clone);
      $$('[data-drag]', clone).forEach(g => g.remove());
      const vb = svg.viewBox.baseVal, k0 = Math.min(2400, Math.max(1200, vb.width * 2)) / vb.width;
      const outW = Math.round(vb.width * k0), outH = Math.round(vb.height * k0);
      clone.setAttribute('width', outW); clone.setAttribute('height', outH); clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
      clone.insertAdjacentHTML('afterbegin', `<rect width="100%" height="100%" fill="${$('#stage').classList.contains('space') ? tok('--space-1') : tok('--stage')}"/>`);
      const data = new XMLSerializer().serializeToString(clone);
      const url = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      const k = outW / 1200, pad = 28 * k, font = n => `${n}px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
      ctx.font = `500 ${font(17 * k)}`;
      const rightW = 330 * k, textW = outW - pad * 3 - rightW;
      const condL = wrapText(ctx, lines.cond, textW), stateL = wrapText(ctx, lines.state, textW);
      const bandH = pad * 2 + (20 + 28) * k + (condL.length + stateL.length) * 26 * k;
      cv.width = outW; cv.height = outH + bandH;
      ctx.fillStyle = tok('--surface-1'); ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, outW, outH); URL.revokeObjectURL(url);
      ctx.fillStyle = tok('--line-2'); ctx.fillRect(0, outH, outW, Math.max(1, k));
      let y = outH + pad + 14 * k;
      ctx.fillStyle = tok('--text-2'); ctx.font = `600 ${font(14 * k)}`; ctx.fillText('실험 결과 · 송쌤과학 가상실험실', pad, y);
      y += 30 * k; ctx.fillStyle = tok('--text-1'); ctx.font = `800 ${font(22 * k)}`; ctx.fillText(`${LAB_TITLE} — ${title}`, pad, y);
      ctx.font = `500 ${font(17 * k)}`; ctx.fillStyle = tok('--text-1');
      for (const l of condL) { y += 26 * k; ctx.fillText(l, pad, y); }
      ctx.fillStyle = tok('--text-2'); for (const l of stateL) { y += 26 * k; ctx.fillText(l, pad, y); }
      const now = new Date(), p2 = n => String(n).padStart(2, '0');
      const stamp = `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
      ctx.textAlign = 'right'; let ry = outH + pad + 14 * k; const rx = outW - pad;
      ctx.fillStyle = tok('--text-1'); ctx.font = `700 ${font(17 * k)}`;
      if (student.sid || student.name) { ctx.fillText(`학번 ${student.sid || '-'} · 이름 ${student.name || '-'}`, rx, ry + 16 * k); ry += 30 * k; }
      ctx.fillStyle = tok('--text-2'); ctx.font = `500 ${font(15 * k)}`; ctx.fillText(stamp, rx, ry + 16 * k); ry += 26 * k;
      ctx.fillText('© 송쌤과학 · @songsamscience', rx, ry + 16 * k); ctx.textAlign = 'left';
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/png')); if (!blob) throw new Error('blob');
      const stampF = `${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}`;
      const fname = [LAB_FILE, '실험결과', student.sid, student.name, stampF].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]/g, '') + '.png';
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      if (!REDUCED) { const f = document.createElement('div'); f.className = 'shutter'; $('#stage').appendChild(f); setTimeout(() => f.remove(), 340); }
      clearTimeout(slow); toast(`실험 결과를 PNG로 저장했어요 — ${fname}`);
      window.__lastCapture = { fname, w: cv.width, h: cv.height, url: cv.toDataURL('image/png') };
    } catch (e) {
      clearTimeout(slow); console.error(e);
      toast('이미지로 저장하지 못했어요. 학습 리포트의 인쇄(PDF로 저장)나 기기의 화면 캡처를 이용해 주세요.', { error: true });
    } finally { btn.removeAttribute('aria-busy'); }
  });
}

let printRestore = null;
function printDoc(make, title) {
  const pv = $('#printview'), oldTitle = document.title, oldTheme = document.documentElement.dataset.theme;
  document.title = title.replace(/[\\/:*?"<>|\s]/g, '');
  document.documentElement.dataset.theme = 'light'; document.documentElement.dataset.print = '1'; TOK.clear();
  pv.innerHTML = make();
  printRestore = () => { document.title = oldTitle; document.documentElement.dataset.theme = oldTheme; delete document.documentElement.dataset.print; TOK.clear(); pv.innerHTML = ''; printRestore = null; redrawAll(); };
  setTimeout(() => { window.print(); }, 60);
}
window.addEventListener('afterprint', () => { if (printRestore) printRestore(); });

/* ═══════════ 이벤트 ═══════════ */
function labAct(fn) { const L = cur.lab; if (!L) return; fn(L); L.draw(); panelDirty = true; syncPanel(); }
function syncPanel() {
  if (!cur.lab) return;
  if (S.screen === 'every') syncEvery();
  else if (S.screen === 'board') syncBoard();
  else if (S.screen === 'orbit') syncOrbit();
  else if (S.screen === 'sky') syncSky();
}
function bind() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button, summary, a'); if (!t) return;
    const d = t.dataset;
    if (d.go) { go(d.go); return; }
    if (t.hasAttribute('data-close')) { closeModal(); return; }
    if (d.theory) { openTheory(d.theory); return; }
    if (t.id === 'saveBtn') { capture(); return; }
    // ① 일상 속 시차
    if (d.escene) { labAct(L => L.setScene(d.escene)); return; }
    if (d.ego) { labAct(L => L.goTo(d.ego)); return; }
    if (t.id === 'eWalk') { labAct(L => L.toggleWalk()); return; }
    if (d.eview) { labAct(L => { L.s.view = d.eview; }); return; }
    // ② 시차 측정 판
    if (d.bmodel) { labAct(L => L.select(d.bmodel)); return; }
    if (d.beye) { labAct(L => L.setEye(d.beye)); return; }
    if (d.bmark) { labAct(L => { L.s.blink = false; L.s.eye = d.bmark; L.msg = ''; L.mark(d.bmark); }); announce(`${d.bmark === 'L' ? '왼쪽' : '오른쪽'} 구멍으로 본 자리를 표시했어요: ${scaleReading(cur.lab.s.marks[d.bmark])}`); return; }
    if (t.id === 'bLines') { labAct(L => L.drawLines()); return; }
    if (t.id === 'bProt') { labAct(L => L.measure()); announce(`각도기로 잰 시차 ${cur.lab.reading()}°`); return; }
    if (t.id === 'bRec') { recBoard(); syncBoard(); return; }
    if (t.id === 'bClr') { const old = records.board; records.board = []; store.set('records', records); renderBoardTable(); toast('기록표를 지웠어요.', { action: '되돌리기', onAction: () => { records.board = old; store.set('records', records); renderBoardTable(); } }); return; }
    // ③ 연주 시차
    if (t.id === 'oPlay') { labAct(L => L.togglePlay()); return; }
    if (d.oobs) { labAct(L => L.observe(d.oobs)); return; }
    if (t.id === 'oClr') { labAct(L => L.clearObs()); return; }
    if (t.id === 'oRec') { recOrbit(); return; }
    if (t.id === 'oClrRec') { const old = records.orbit; records.orbit = []; store.set('records', records); renderOrbitTable(); toast('기록을 지웠어요.', { action: '되돌리기', onAction: () => { records.orbit = old; store.set('records', records); renderOrbitTable(); } }); return; }
    if (t.id === 'oReal') { labAct(L => L.setReal(!L.s.real)); return; }
    // ④ 거리 비교
    if (d.smode) { labAct(L => L.setMode(d.smode)); renderSkyPick(); return; }
    if (d.sphoto) { labAct(L => L.setPhoto(d.sphoto)); return; }
    if (d.sstar) { labAct(L => L.setStar(d.sstar)); return; }
    if (d.smeas) { measSky(d.smeas); return; }
    if (t.id === 'sClr') { const old = records.sky; records.sky = {}; store.set('records', records); renderSkyTable(); renderSkyPick(); toast('기록을 지웠어요.', { action: '되돌리기', onAction: () => { records.sky = old; store.set('records', records); renderSkyTable(); renderSkyPick(); } }); return; }
    // 탐구 질문
    if (d.hint) { const p = $('#hint-' + d.hint); p.hidden = !p.hidden; t.setAttribute('aria-expanded', !p.hidden); if (!p.hidden && !hints[d.hint]) { hints[d.hint] = true; store.set('hints', hints); syncCard(d.hint); } return; }
    if (d.model) { askModel(d.model); return; }
    if (d.mini) { const fig = t.closest('figure.mini'); miniAct(fig.dataset.q, d.mini, d.v, t); return; }
    if (t.id === 'toReport') { openReport(); return; }
    // 크롬
    if (t.id === 'themeBtn') { toggleTheme(); return; }
    if (t.id === 'fullBtn') { toggleFull(); return; }
    if (t.id === 'bookBtn') { openTheory(); return; }
    if (t.id === 'helpBtn') { openHelp(); return; }
    if (t.id === 'reportBtn') { openReport(); return; }
    if (t.id === 'dHelp') { $('#drawer').close(); openHelp(); return; }
    if (t.id === 'dReport') { $('#drawer').close(); openReport(); return; }
    if (t.id === 'closeModal') { closeModal(); return; }
    if (t.id === 'closeDrawer') { $('#drawer').close(); return; }
  });
  document.addEventListener('input', e => {
    const t = e.target, L = cur.lab;
    if (t.id === 'eD') { L.setD(+t.value); L.draw(); syncEvery(); return; }
    if (t.id === 'eLines') { L.s.lines = t.checked; L.draw(); return; }
    if (t.id === 'bSight') { L.s.sight = t.checked; L.draw(); return; }
    if (t.id === 'oM') { L.s.play = false; L.target = null; L.setM(+t.value); L.draw(); syncOrbit(); return; }
    if (t.id === 'oDX') { L.setDX(+t.value); L.draw(); syncOrbit(); return; }
    if (t.id === 'oY') { L.s.showY = t.checked; L.draw(); syncOrbit(); return; }
    if (t.dataset.mini && t.type === 'range') { miniAct(t.closest('figure.mini').dataset.q, t.dataset.mini, t.value, t); return; }
    const m = t.id.match(/^(ans|rv)-(q\d)$/);
    if (m) {
      const [, kind, q] = m;
      if (kind === 'ans') { if (locks[q]) return; answers[q] = t.value; store.set('answers', answers); syncProgress(); }
      else { revisions[q] = t.value; store.set('revisions', revisions); }
      syncCard(q);
    }
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (t.matches && t.matches('input:not([type=checkbox]):not([type=range]), textarea, select, [contenteditable]')) return;
    if ($('#modal').open || $('#drawer').open) return;
    const k = e.key.toLowerCase(), L = cur.lab, sc = S.screen;
    if (k === 'f') { e.preventDefault(); toggleFull(); }
    else if (k === 'd') toggleTheme();
    else if (k === 'h') openHelp();
    else if (k === 'r') openReport();
    else if (k === 'c' && isBench()) capture();
    else if (sc === 'every' && (k === 'a' || k === 'b')) labAct(L2 => L2.goTo(k.toUpperCase()));
    else if (e.key === ' ' && L && (t === document.body || t.id === 'main' || (t.closest && (t.closest('.stage') || t.closest('.toolbar') && t.tagName !== 'BUTTON')))) {
      if (sc === 'every') { e.preventDefault(); labAct(L2 => L2.toggleWalk()); }
      else if (sc === 'orbit') { e.preventDefault(); labAct(L2 => L2.togglePlay()); }
      else if (sc === 'sky') { e.preventDefault(); labAct(L2 => L2.setPhoto(L2.s.photo === 'blink' ? 'jan' : 'blink')); }
      else if (sc === 'board') { e.preventDefault(); labAct(L2 => L2.setEye('blink')); }
    }
  });
  $$('dialog').forEach(d => {
    d.addEventListener('close', () => { const r = d.id === 'drawer' ? drawerReturn : modalReturn; if (r && r.isConnected) r.focus({ preventScroll: true }); });
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
  });
  document.addEventListener('toggle', e => { const c = e.target; if (c.classList && c.classList.contains('qcard') && c.open) openMini(c.dataset.q); }, true);
  document.addEventListener('fullscreenchange', syncFull);
}

/* ═══════════ 시작 ═══════════ */
let lastTs = 0, panelT = 0;
function loop(ts) {
  const dt = lastTs ? Math.min(.05, Math.max(0, (ts - lastTs) / 1000)) : 0; lastTs = ts;
  try {
    const L = cur.lab;
    if (L) {
      if (L.step(dt) || L.dirty) L.draw();
      panelT += dt; if (panelDirty || panelT > .15) { panelT = 0; panelDirty = false; syncPanel(); }
    } else if (S.screen === 'quiz') {
      for (const [qid, m] of Object.entries(minis)) {
        const card = $('#card-' + qid); if (!card || !card.open || !m.L || !m.el || !m.el.isConnected) continue;
        m.tick(dt);
        if (m.changed || (m.rt = (m.rt || 0) + dt) > .25) {
          m.rt = 0;
          if (m.changed) {
            m.changed = false; const fig = card.querySelector('figure.mini'), ctl = fig.querySelector('.mini-ctl');
            if (!ctl.contains(document.activeElement)) ctl.innerHTML = m.controls();
            else { const fresh = document.createElement('div'); fresh.innerHTML = m.controls();       // 포커스가 조작 줄에 있으면 다시 그리지 않고 눌림 상태만 맞춘다
              $$('[aria-pressed]', ctl).forEach(b => { const f = fresh.querySelector(b.dataset.v != null ? `[data-mini="${b.dataset.mini}"][data-v="${b.dataset.v}"]` : `[data-mini="${b.dataset.mini}"]`); if (f) b.setAttribute('aria-pressed', f.getAttribute('aria-pressed')); });
              $$('input[type="range"][data-mini]', ctl).forEach(r => { const f = fresh.querySelector(`input[data-mini="${r.dataset.mini}"]`); if (!f) return; r.value = f.value; const o = r.nextElementSibling, fo = f.nextElementSibling; if (o && fo && o.tagName === 'OUTPUT') o.textContent = fo.textContent; }); }   // 끌기로 바뀐 거리를 손잡이·값에도
          }
          setT(card.querySelector('.mini-result'), m.result());
        }
      }
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
function init() {
  $('#spriteDefs').innerHTML = `<linearGradient id="ig-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--ig-1)"/><stop offset=".35" stop-color="var(--ig-2)"/><stop offset=".65" stop-color="var(--ig-3)"/><stop offset="1" stop-color="var(--ig-4)"/></linearGradient>`;
  $('#yt').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.yt}</svg>`;
  $('#ig').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.ig}</svg>`;
  $('#brandIc').innerHTML = icon('flask');
  $('#bookBtn').innerHTML = icon('book'); $('#helpBtn').innerHTML = icon('help'); $('#reportBtn').innerHTML = icon('report');
  $('#dHelp').insertAdjacentHTML('afterbegin', icon('help')); $('#dReport').insertAdjacentHTML('afterbegin', icon('report'));
  $('#closeModal').innerHTML = icon('x'); $('#closeDrawer').innerHTML = icon('x');
  $('#ver').textContent = `v${APP_VERSION}`;
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  syncFull(); bind(); go(S.screen);
  // 지난 기록을 불러올지 고르기 전에 새로고침했으면 한 번 더 묻는다(그동안 사본은 그대로 둔다)
  if (student.keepPending && student.sid) { try { const b = JSON.parse(localStorage.getItem(KEY('p-' + student.sid)) || 'null'); if (b) toast('이 기기에 남긴 지난 기록이 있어요.', { action: '지난 기록 이어하기', onAction: () => restoreKept(student.sid, b) }); } catch (e) { } }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cur.lab) cur.lab.draw(); });
  requestAnimationFrame(loop);
}
init();

</script>
